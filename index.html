<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алтын Ачкыч | Агентство Недвижимости</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo" onclick="showSection('hero')">АЛТЫН <span>АЧКЫЧ</span></div>
    <nav id="main-nav">
        <button class="nav-btn" onclick="showSection('search')">Поиск</button>
        <button class="nav-btn" id="admin-nav-link" onclick="showSection('login')">Админ</button>
    </nav>
</header>

<main class="container">
    
    <!-- СЕКЦИЯ 1: ЛЕНДИНГ (HERO) -->
    <section id="hero" class="section active">
        <div style="text-align: center; padding: 40px 0;">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Найдите дом мечты</h1>
            <p style="color: var(--gold); letter-spacing: 1px;">ЭКСКЛЮЗИВНАЯ НЕДВИЖИМОСТЬ КЫРГЫЗСТАНА</p>
            <br><br>
            <div class="grid" id="featured-grid">
                <!-- Сюда грузятся последние объекты -->
            </div>
        </div>
    </section>

    <!-- СЕКЦИЯ 2: ПОИСК -->
    <section id="search" class="section">
        <div class="search-wrapper" style="margin-bottom: 30px;">
            <input type="text" id="globalSearch" placeholder="Поиск по названию, району или цене..." oninput="handleSearch()">
        </div>
        <div class="grid" id="search-grid">
            <!-- Результаты поиска -->
        </div>
    </section>

    <!-- СЕКЦИЯ 3: ВХОД В АДМИНКУ -->
    <section id="login" class="section">
        <div class="glass-panel">
            <h2 style="text-align:center; margin-bottom:20px; color:var(--gold);">Доступ ограничен</h2>
            <input type="password" id="adminPass" placeholder="Введите пароль администратора">
            <button class="btn-gold" onclick="checkAuth()">Войти в систему</button>
            <p id="loginError" style="color:var(--error); font-size:0.8rem; margin-top:10px; text-align:center; display:none;">Неверный пароль!</p>
        </div>
    </section>

    <!-- СЕКЦИЯ 4: АДМИН-ПАНЕЛЬ (CRUD) -->
    <section id="admin" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color:var(--gold)">Панель управления</h2>
            <button class="nav-btn" style="border-color:var(--error); color:var(--error);" onclick="logout()">Выйти</button>
        </div>

        <div class="glass-panel" style="max-width: 100%; margin-bottom: 40px;">
            <h3 style="margin-bottom: 20px;">Добавить новый объект</h3>
            <form id="addForm" onsubmit="saveObject(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <input type="text" id="f_title" placeholder="Название объекта" required>
                    <input type="number" id="f_price" placeholder="Цена в USD ($)" required>
                    <input type="text" id="f_address" placeholder="Район / Адрес" required>
                    <input type="text" id="f_img" placeholder="Ссылка на фото (Direct URL)" required>
                    <select id="f_type">
                        <option value="Квартира">Квартира</option>
                        <option value="Дом / Коттедж">Дом / Коттедж</option>
                        <option value="Участок">Участок</option>
                        <option value="Коммерческая">Коммерческая</option>
                    </select>
                </div>
                <button type="submit" class="btn-gold">Опубликовать на сайт</button>
            </form>
        </div>

        <h3 style="margin-bottom: 20px;">Текущие объекты (Редактирование)</h3>
        <div class="grid" id="admin-grid"></div>
    </section>

</main>

<script>
    let editingId = null;
    // КОНФИГУРАЦИЯ
    const PROJECT_ID = "argen-59e33";
    const API_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/realty`;
    const ADMIN_PASS = "admin777"; // Пароль для входа
    let isAuthorized = false;
    let allData = [];

    // НАВИГАЦИЯ
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        // Автоматическая загрузка данных при переходе
        if(id === 'hero' || id === 'search' || id === 'admin') loadData();
    }

    // АВТОРИЗАЦИЯ
    function checkAuth() {
        const pass = document.getElementById('adminPass').value;
        if(pass === ADMIN_PASS) {
            isAuthorized = true;
            document.getElementById('loginError').style.display = 'none';
            showSection('admin');
            document.getElementById('admin-nav-link').innerText = "Админка";
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function logout() {
        isAuthorized = false;
        document.getElementById('adminPass').value = '';
        document.getElementById('admin-nav-link').innerText = "Админ";
        showSection('hero');
    }

    // ЗАГРУЗКА ДАННЫХ
    async function loadData() {
        try {
            const res = await fetch(API_URL + "?orderBy=price desc");
            const data = await res.json();
            allData = (data.documents || []).map(doc => ({
                id: doc.name.split('/').pop(),
                title: doc.fields.title?.stringValue || 'Без названия',
                price: doc.fields.price?.integerValue || doc.fields.price?.stringValue || 0,
                address: doc.fields.address?.stringValue || '',
                img: doc.fields.img?.stringValue || '',
                type: doc.fields.type?.stringValue || 'Объект'
            }));
            renderAll();
        } catch (e) { console.error("Ошибка загрузки:", e); }
    }

    // ОТРИСОВКА ВСЕХ СЕТОК
    function renderAll() {
        renderGrid('featured-grid', allData.slice(0, 3)); // На главной только 3 последних
        renderGrid('search-grid', allData);
        renderGrid('admin-grid', allData, true); // В админке с кнопками удаления
    }

    function renderGrid(containerId, data, withControls = false) {
        const container = document.getElementById(containerId);
        if(!container) return;

        container.innerHTML = data.map(item => `
            <div class="card">
                <div class="card-img" style="background-image: url('${item.img}')">
                    <div class="card-badge">${item.type}</div>
                </div>
                <div class="card-content">
                    <div class="card-price">$${Number(item.price).toLocaleString()}</div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-info">📍 ${item.address}</div>
                    ${withControls ? `
                        <div class="admin-controls">
                            <button class="btn-del" onclick="deleteObject('${item.id}')">Удалить</button>
                             <button class="btn-edit" onclick="prepareEdit('${item.id}')" style="background:#3498db; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; margin-right:5px;">Изменить</button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    // ПОИСК
    function handleSearch() {
        const query = document.getElementById('globalSearch').value.toLowerCase();
        const filtered = allData.filter(i => 
            i.title.toLowerCase().includes(query) || 
            i.address.toLowerCase().includes(query) ||
            i.price.toString().includes(query)
        );
        renderGrid('search-grid', filtered);
    }

    // СОХРАНЕНИЕ (CREATE)
    async function saveObject(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "Сохранение...";

        const payload = {
            fields: {
                title: { stringValue: document.getElementById('f_title').value },
                price: { integerValue: parseInt(document.getElementById('f_price').value) },
                address: { stringValue: document.getElementById('f_address').value },
                img: { stringValue: document.getElementById('f_img').value },
                type: { stringValue: document.getElementById('f_type').value }
            }
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        e.target.reset();
        btn.innerText = "Опубликовать на сайт";
        loadData();
    }

    // УДАЛЕНИЕ (DELETE)
    async function deleteObject(id) {
        if(!confirm("Вы уверены, что хотите удалить этот объект?")) return;
        
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadData();
    }

    // ПЕРВЫЙ ЗАПУСК
    loadData();
</script>

</body>
</html>
