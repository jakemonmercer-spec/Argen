<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алтын Ачкыч | Агентство Недвижимости</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --dark-bg: #0F1012;
            --card-bg: #1E1F23;
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --accent: #2C2E33;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-main); line-height: 1.6; }
        header {
            background: rgba(15, 16, 18, 0.95); backdrop-filter: blur(10px);
            padding: 20px 15px; position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--gold); }
        nav { display: flex; gap: 10px; }
        nav button {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
            font-weight: 600; transition: 0.3s;
        }
        nav button.active { background: var(--gold); color: #000; }
        .container { max-width: 1200px; margin: 100px auto 40px; padding: 0 15px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .search-wrapper input {
            width: 100%; padding: 15px; background: var(--card-bg);
            border: 1px solid var(--accent); border-radius: 12px; color: white; margin-bottom: 30px;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .card-img { width: 100%; height: 200px; background-size: cover; background-position: center; position: relative; }
        .card-content { padding: 20px; }
        .card-price { font-size: 1.4rem; font-weight: 700; color: var(--gold); }
        .card-title { font-size: 1rem; margin: 10px 0; }
        .form-container { max-width: 500px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 20px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--dark-bg); border: 1px solid var(--accent); color: white; border-radius: 8px; }
        .btn-submit { width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">Алтын <span>Ачкыч</span></div>
    <nav>
        <button onclick="showPage('catalog')" id="btn-catalog" class="active">Каталог</button>
        <button onclick="showPage('add')" id="btn-add">Добавить</button>
    </nav>
</header>

<div class="container">
    <section id="page-catalog" class="page active">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Поиск по району..." oninput="filterData()">
        </div>
        <div class="grid" id="main-grid"></div>
    </section>

    <section id="page-add" class="page">
        <div class="form-container">
            <h2 style="color:var(--gold); margin-bottom:20px; text-align:center;">Новый объект</h2>
            <form id="addForm">
                <input type="text" id="title" placeholder="Название объекта" required>
                <input type="number" id="price" placeholder="Цена ($)" required>
                <input type="text" id="address" placeholder="Район / Адрес" required>
                <input type="text" id="img" placeholder="Ссылка на фото (URL)" required>
                <select id="type">
                    <option value="Квартира">Квартира</option>
                    <option value="Дом">Дом</option>
                </select>
                <button type="submit" class="btn-submit">Сохранить в базу</button>
            </form>
        </div>
    </section>
</div>

<script>
    const PROJECT_ID = "argen-59e33";
    const BASE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/realty`;
    let allObjects = [];

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
        if(pageId === 'catalog') loadData();
    }

    async function loadData() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '<p style="text-align:center; width:100%;">Загрузка из облака...</p>';
        try {
            const res = await fetch(BASE_URL);
            const data = await res.json();
            allObjects = (data.documents || []).map(doc => {
                const f = doc.fields;
                return {
                    id: doc.name.split('/').pop(),
                    title: f.title?.stringValue || 'Без названия',
                    price: f.price?.integerValue || f.price?.stringValue || 0,
                    address: f.address?.stringValue || '',
                    img: f.img?.stringValue || '',
                    type: f.type?.stringValue || 'Объект'
                };
            });
            renderGrid(allObjects);
        } catch (err) {
            grid.innerHTML = '<p style="color:red">Ошибка связи с базой.</p>';
        }
    }

    function renderGrid(data) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = data.map(item => `
            <div class="card">
                <div class="card-img" style="background-image: url('${item.img}')"></div>
                <div class="card-content">
                    <div class="card-price">$${Number(item.price).toLocaleString()}</div>
                    <div class="card-title">${item.title}</div>
                    <div style="color:var(--text-muted); font-size:0.8rem">📍 ${item.address}</div>
                </div>
            </div>
        `).join('');
    }

    function filterData() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderGrid(allObjects.filter(o => o.title.toLowerCase().includes(q) || o.address.toLowerCase().includes(q)));
    }

    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = 'Сохранение...';

        const payload = {
            fields: {
                title: { stringValue: document.getElementById('title').value },
                price: { integerValue: parseInt(document.getElementById('price').value) },
                address: { stringValue: document.getElementById('address').value },
                img: { stringValue: document.getElementById('img').value },
                type: { stringValue: document.getElementById('type').value }
            }
        };

        try {
            const res = await fetch(BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Готово! Объект в базе.');
                e.target.reset();
                showPage('catalog');
            } else {
                const err = await res.json();
                alert('Ошибка базы: ' + (err.error.message || 'Проверьте Rules в Firebase'));
            }
        } catch (err) {
            alert('Сетевая ошибка!');
        } finally {
            btn.innerText = 'Сохранить в базу';
        }
    };

    loadData();
</script>
</body>
</html>
